<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Day Planner</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --surface: #eef3ff;
        --primary: #4f46e5;
        --primary-dark: #3b35c4;
        --success: #22c55e;
        --danger: #ef4444;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f3;
        --shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, #f9fafb 100%);
        color: var(--text);
      }

      .app {
        max-width: 760px;
        margin: 48px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }

      .add-row {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.98rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary-btn {
        background: var(--primary);
        color: white;
      }

      .primary-btn:hover { background: var(--primary-dark); }

      .secondary-btn {
        background: var(--surface);
        color: var(--primary);
      }

      .danger-btn {
        background: #fee2e2;
        color: var(--danger);
      }

      .task-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fbfdff;
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .task-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .task-text {
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .task-item.done .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .empty-state {
        padding: 18px 12px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        background: #fafbff;
        color: var(--muted);
        text-align: center;
      }

      .api-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        margin-bottom: 18px;
      }

      .api-row input {
        flex: 1;
      }

      .summary-box {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid var(--border);
      }

      .summary-box h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
      }

      .summary-text {
        margin: 0;
        line-height: 1.5;
        color: var(--text);
      }

      .status {
        min-height: 20px;
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: 8px;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: #166534;
      }

      @media (max-width: 620px) {
        .app { padding: 16px; }
        .panel { padding: 18px; }
        .add-row, .api-row { flex-direction: column; }
        .add-row button, .api-row button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Todo List</h1>

        <div class="add-row">
          <input id="taskInput" type="text" placeholder="Add a task..." aria-label="New task" />
          <button id="addTaskBtn" class="primary-btn" type="button">Add Task</button>
        </div>

        <ul id="taskList" class="task-list" aria-live="polite"></ul>

        <div class="api-row">
          <input id="apiKeyInput" type="password" placeholder="Groq API key" aria-label="Groq API key" />
        </div>

        <button id="summarizeBtn" class="secondary-btn" type="button">Summarize My Day with Groq</button>
        <div id="status" class="status" aria-live="polite"></div>

        <div class="summary-box">
          <h2>Today's Summary</h2>
          <p id="summaryText" class="summary-text">No summary yet.</p>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'todo-list-items';
      const API_KEY_STORAGE = 'groq-api-key';

      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskList = document.getElementById('taskList');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const summarizeBtn = document.getElementById('summarizeBtn');
      const summaryText = document.getElementById('summaryText');
      const status = document.getElementById('status');

      const loadTasks = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (error) {
          return [];
        }
      };

      const saveTasks = (tasks) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      };

      const addTask = (text) => {
        const value = text.trim();
        if (!value) {
          taskInput.focus();
          return;
        }

        const tasks = loadTasks();
        tasks.push({ id: Date.now(), text: value, done: false });
        saveTasks(tasks);
        renderTasks();
        taskInput.value = '';
        taskInput.focus();
      };

      const toggleTaskDone = (id) => {
        const tasks = loadTasks().map((task) =>
          task.id === id ? { ...task, done: !task.done } : task
        );
        saveTasks(tasks);
        renderTasks();
      };

      const deleteTask = (id) => {
        const tasks = loadTasks().filter((task) => task.id !== id);
        saveTasks(tasks);
        renderTasks();
      };

      const renderTasks = () => {
        const tasks = loadTasks();
        taskList.innerHTML = '';

        if (tasks.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = 'No tasks yet. Add one above.';
          taskList.appendChild(empty);
          return;
        }

        tasks.forEach((task) => {
          const item = document.createElement('li');
          item.className = `task-item${task.done ? ' done' : ''}`;

          const taskMain = document.createElement('div');
          taskMain.className = 'task-main';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.done;
          checkbox.setAttribute('aria-label', `Mark task done: ${task.text}`);
          checkbox.addEventListener('change', () => toggleTaskDone(task.id));

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = task.text;

          taskMain.appendChild(checkbox);
          taskMain.appendChild(text);

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'danger-btn';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', () => deleteTask(task.id));

          item.appendChild(taskMain);
          item.appendChild(deleteBtn);
          taskList.appendChild(item);
        });
      };

      const setStatus = (message, type = '') => {
        status.textContent = message;
        status.className = `status${type ? ` ${type}` : ''}`;
      };

      const readApiKey = () => {
        const value = apiKeyInput.value.trim();
        if (value) localStorage.setItem(API_KEY_STORAGE, value);
        return value;
      };

      const loadApiKey = async () => {
        const storedKey = localStorage.getItem(API_KEY_STORAGE);
        if (storedKey) {
          apiKeyInput.value = storedKey;
          return;
        }

        try {
          const response = await fetch('./.env');
          if (!response.ok) return;
          const envText = await response.text();
          const match = envText.match(/(?:^|\n)\s*GROQ_API_KEY\s*=\s*['"]?([^\n'"#]+)['"]?/i);
          if (match && match[1]) {
            const key = match[1].trim();
            apiKeyInput.value = key;
            localStorage.setItem(API_KEY_STORAGE, key);
          }
        } catch (error) {
          // Ignore if .env is not served locally.
        }
      };

      const buildTodoText = () => {
        const tasks = loadTasks();
        if (tasks.length === 0) return 'No tasks planned for today.';

        return tasks
          .map((task, index) => `${index + 1}. ${task.text}${task.done ? ' (completed)' : ''}`)
          .join('\n');
      };

      const summarizeDay = async () => {
        const apiKey = readApiKey();
        const todoText = buildTodoText();

        if (!apiKey) {
          setStatus('Add your Groq API key to summarize your day.', 'error');
          apiKeyInput.focus();
          return;
        }

        setStatus('Sending your tasks to Groq...', '');

        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              messages: [
                {
                  role: 'system',
                  content: 'You are a helpful assistant. Summarize a person\'s day in exactly one sentence based on their todo list.'
                },
                {
                  role: 'user',
                  content: `Here is my todo list:\n${todoText}\n\nGive me exactly one sentence describing what my day looks like.`
                }
              ],
              temperature: 0.7,
              max_tokens: 80
            })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || 'Request failed.');
          }

          const data = await response.json();
          const summary = data.choices?.[0]?.message?.content?.trim();

          if (!summary) {
            throw new Error('No summary returned by Groq.');
          }

          summaryText.textContent = summary;
          setStatus('Day summary ready.', 'success');
        } catch (error) {
          console.error(error);
          summaryText.textContent = 'Unable to generate a summary right now.';
          setStatus(`Could not summarize your day: ${error.message || 'Unexpected error'}`, 'error');
        }
      };

      addTaskBtn.addEventListener('click', () => addTask(taskInput.value));
      taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addTask(taskInput.value);
        }
      });

      summarizeBtn.addEventListener('click', summarizeDay);
      apiKeyInput.addEventListener('input', () => {
        readApiKey();
      });

      renderTasks();
      loadApiKey();
    </script>
  </body>
</html>
